services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: bioview
      POSTGRES_PASSWORD: bioview
      POSTGRES_DB: bioview
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bioview"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://bioview:bioview@postgres:5432/bioview
      JATS_CACHE_PATH: /tmp/bio-view/jats
      MECA_TEMP_PATH: /tmp/bio-view/meca_tmp
    ports:
      - "8000:8000"

volumes:
  postgres_data:
