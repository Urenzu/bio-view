services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bioview
      POSTGRES_PASSWORD: bioview
      POSTGRES_DB: bioview
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bioview"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/6333"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://bioview:bioview@postgres:5432/bioview
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8000:8000"
    volumes:
      - ./data/jats:/app/data/jats
      - ./data/meca_tmp:/app/data/meca_tmp

volumes:
  postgres_data:
  qdrant_data:
